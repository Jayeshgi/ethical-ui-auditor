name: backend-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          JWT_SECRET_KEY: ci-only-secret-key-not-for-production
          DATABASE_URL: sqlite:///${{ github.workspace }}/runtime_data/ci.db
        run: pytest backend/tests -q

  dealcart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compile benchmark JavaScript
        working-directory: benchmarks/dealcart
        run: npm run check
      - name: Test benchmark server and state model
        working-directory: benchmarks/dealcart
        run: npm test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ethical-ui-auditor:${{ github.sha }}
      - name: Verify bundled Playwright browser
        run: >-
          docker run --rm --entrypoint python
          ethical-ui-auditor:${{ github.sha }}
          -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(headless=True); print(b.version); b.close(); p.stop()"
